services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "adigrams", "--bind_ip_all", "--port", "27018"]
    ports:
      - "127.0.0.1:27018:27018"
    volumes:
      - adigrams_mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --port 27018 --eval
          'try { if (!rs.status().ok) quit(1); } catch (e) { rs.initiate({_id:"adigrams",members:[{_id:0,host:"127.0.0.1:27018"}]}); quit(1); }'
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  adigrams_mongo:
